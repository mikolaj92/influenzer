version = "2"
id = "influenzer"
title = "Influenzer HoM operator"
description = "Local 24/7 Head of Marketing: brief in, score, one-arena draft or kill. Dry-run default. Not a Fala host — the Mojo correlator in mikolaj92/Fala conducts this package."
tags = ["influenzer", "hom", "local"]

[[impulse_types]]
id = "hom.brief"
title = "HoM brief"
media_types = ["application/json"]
value_schema = { type = "object", properties = { project_id = { type = "string" }, brief_id = { type = "string" }, story_kind = { type = "string" }, facts = { type = "array" } }, required = ["project_id", "brief_id"] }

[[association_kinds]]
id = "hom.score"
title = "HoM score"

[[reaction_kinds]]
id = "hom.decision"
title = "Kill, changelog-only, or one-angle draft"
media_types = ["application/json"]

[[capabilities]]
id = "tick_all"
title = "Single scheduled mutator: score pending briefs; never auto-publish; does not survey GitHub"
accepts_impulse_types = ["hom.brief"]
emits_reaction_kinds = ["hom.decision"]
emits_association_kinds = ["hom.score"]

[[correlation_paths]]
id = "operator_tick"
title = "Brief → score → draft or kill"

[[correlation_paths.effectors]]
id = "tick"
capability = "tick_all"
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.tick_all"] }

[[impulse_types]]
id = "github.scan"
title = "Public GitHub repo to survey"
media_types = ["application/json"]
value_schema = { type = "object", properties = { project_id = { type = "string" }, repo = { type = "string" } }, required = ["project_id", "repo"] }

[[reaction_kinds]]
id = "github.survey"
title = "Public GitHub survey or scan silence"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.pack"
title = "Packed ship facts or scan silence"
media_types = ["application/json"]

[[reaction_kinds]]
id = "hom.brief"
title = "Pending HoM brief or scan silence"
media_types = ["application/json"]

[[capabilities]]
id = "github_survey"
title = "Public GitHub signals → JSON; silence if missing, unauth, private, or empty"
accepts_impulse_types = ["github.scan"]
emits_reaction_kinds = ["github.survey"]

[[capabilities]]
id = "github_pack"
title = "Pack ship+tryable facts or silence; waitlist and commit noise fail closed"
accepts_impulse_types = ["github.scan"]
emits_reaction_kinds = ["github.pack"]

[[capabilities]]
id = "brief_admit"
title = "Admit at most one pending brief into state.db; never opens runtime.db; does not call gh"
accepts_impulse_types = ["github.scan"]
emits_reaction_kinds = ["hom.brief"]

[[correlation_paths]]
id = "github_scan"
title = "Public GitHub survey → 0 or 1 pending brief"
description = "Fala conducts github_survey → github_pack → influenzer.brief_admit. Domain state stays in state.db. Effectors never open runtime.db. Not on the 5-minute tick."

[[correlation_paths.effectors]]
id = "survey"
capability = "github_survey"
adapter = { kind = "subprocess", command = ["python3", "-m", "github_survey"] }

[[correlation_paths.effectors]]
id = "pack"
capability = "github_pack"
conduction = ["survey"]
adapter = { kind = "subprocess", command = ["python3", "-m", "github_pack"] }

[[correlation_paths.effectors]]
id = "admit"
capability = "brief_admit"
conduction = ["pack"]
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.brief_admit"] }

[[impulse_types]]
id = "github.scan_due"
title = "Coarse public GitHub look for one project+repo"
media_types = ["application/json"]
value_schema = { type = "object", properties = { project_id = { type = "string" }, repo = { type = "string" }, window_days = { type = "integer" } }, required = ["project_id", "repo"] }

[[capabilities]]
id = "scan_due"
title = "Survey public GitHub only when the coarse window elapsed; 0 or 1 brief or silence"
accepts_impulse_types = ["github.scan_due"]
emits_reaction_kinds = ["hom.brief"]

[[correlation_paths]]
id = "github_scan_due"
title = "Coarse GitHub look → 0 or 1 pending brief, or not-due silence"
description = "Same effect as scan only when due. Does not score, dress, publish, enable live, know Heimdall, know my-auth, implement github_pack shape, or run every tick interval. Tick still does not survey GitHub. Requires project-id and repo."

[[correlation_paths.effectors]]
id = "scan_due"
capability = "scan_due"
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.scan_due"] }

[[impulse_types]]
id = "hom.scored_brief"
title = "Scored HoM brief"
media_types = ["application/json"]
value_schema = { type = "object", properties = { brief = { type = "object" }, score = { type = "object" } }, required = ["brief", "score"] }

[[reaction_kinds]]
id = "hom.draft"
title = "Costume-native one-arena draft or silence"
media_types = ["application/json"]

[[capabilities]]
id = "hom_draft"
title = "Dress a scored brief into costume-native copy, or silence; does not score, pick an arena, write state.db, or publish"
accepts_impulse_types = ["hom.scored_brief"]
emits_reaction_kinds = ["hom.draft"]

[[correlation_paths]]
id = "hom_draft"
title = "Scored brief → costume-native draft or silence"
description = "Does not survey GitHub, call gh, write state.db, pick the arena, score, publish, or enable live. Host compose is apply_brief / tick (score then this block)."

[[correlation_paths.effectors]]
id = "draft"
capability = "hom_draft"
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.hom_draft"] }

[[impulse_types]]
id = "hom.angle"
title = "Ask for the current wearable angle"
media_types = ["application/json"]
value_schema = { type = "object", properties = { project_id = { type = "string" } } }

[[reaction_kinds]]
id = "hom.angle"
title = "One wearable draft packet or silence"
media_types = ["application/json"]

[[capabilities]]
id = "hom_outbox"
title = "Emit at most one wearable draft from state.db, or silence; does not score, dress, publish, write, or enable live"
accepts_impulse_types = ["hom.angle"]
emits_reaction_kinds = ["hom.angle"]

[[correlation_paths]]
id = "hom_outbox"
title = "state.db → one angle or silence"
description = "Does not survey GitHub, call gh, score, dress, publish, enable live, send mail, or open runtime.db. Read-only on operator_drafts. Newest wearable by created_at, then draft_id. Host compose is influenzer angle."

[[correlation_paths.effectors]]
id = "outbox"
capability = "hom_outbox"
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.hom_outbox"] }

[[impulse_types]]
id = "hom.verdict"
title = "Hold or pass the current wearable angle"
media_types = ["application/json"]
value_schema = { type = "object", properties = { verdict = { type = "string" }, project_id = { type = "string" }, draft_id = { type = "string" } }, required = ["verdict"] }

[[reaction_kinds]]
id = "hom.verdict"
title = "Gate decision on the current angle, or silence"
media_types = ["application/json"]

[[capabilities]]
id = "hom_verdict"
title = "Hold or pass the current wearable draft; hold releases the one-story lock; does not publish, score, dress, scan, or enable live"
accepts_impulse_types = ["hom.verdict"]
emits_reaction_kinds = ["hom.verdict"]

[[correlation_paths]]
id = "hom_verdict"
title = "Current angle → hold or pass"
description = "Does not survey GitHub, call gh, score, dress, scan, publish, enable live, send mail, know Heimdall, or open runtime.db. Hold archives the draft so scan-due may run again. Pass records fit and does not post. Host compose is influenzer verdict."

[[correlation_paths.effectors]]
id = "verdict"
capability = "hom_verdict"
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.hom_verdict"] }

[[impulse_types]]
id = "hom.pass"
title = "One CMO look for one project+repo"
media_types = ["application/json"]
value_schema = { type = "object", properties = { project_id = { type = "string" }, repo = { type = "string" }, window_days = { type = "integer" } }, required = ["project_id", "repo"] }

[[reaction_kinds]]
id = "hom.pass"
title = "Scan effect, tick summary, and one angle or silence"
media_types = ["application/json"]

[[capabilities]]
id = "hom_pass"
title = "One CMO look: scan-due, score pending briefs, one angle; never publishes"
accepts_impulse_types = ["hom.pass"]
emits_reaction_kinds = ["hom.pass"]

[[correlation_paths]]
id = "hom_pass"
title = "One CMO look: scan-due → tick → one angle"
description = "Compose existing scan_due, tick_all, and hom_outbox once. Does not invoke verdict, publish, enable live, call gh, know Heimdall, run every tick interval, merge those three modules, or open runtime.db. Requires project-id and repo. Host compose is influenzer pass."

[[correlation_paths.effectors]]
id = "pass"
capability = "hom_pass"
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.hom_pass"] }

# Always-on interval loop is `influenzer-tick` on a Mac mini (not a laptop LaunchAgent).
# Fala conducts tick, always-run github_scan, coarse github_scan_due, and one-shot hom_pass (not on the 5-minute tick).
# `influenzer brief scan` is always-run host compose; `influenzer brief scan-due` is the weekly-ish look; `influenzer pass` is one CMO cycle.

# Fala-owned journal. Domain state stays in state.db. Effectors never open this file.
[runtime.backend]
kind = "sqlite"
path = "runtime.db"

[runtime.reaction_store]
kind = "filesystem"
root = "artifacts/fala-reactions"
