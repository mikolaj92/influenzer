version = "2"
id = "influenzer"
title = "Influenzer HoM operator"
description = "Local 24/7 Head of Marketing: brief in, score, one-arena draft or kill. Dry-run default. Not a Fala host — the Mojo correlator in mikolaj92/Fala conducts this package."
tags = ["influenzer", "hom", "local"]

[[impulse_types]]
id = "hom.brief"
title = "HoM brief"
media_types = ["application/json"]
value_schema = { type = "object", properties = { project_id = { type = "string" }, brief_id = { type = "string" }, story_kind = { type = "string" }, facts = { type = "array" } }, required = ["project_id", "brief_id"] }

[[association_kinds]]
id = "hom.score"
title = "HoM score"

[[reaction_kinds]]
id = "hom.decision"
title = "Kill, changelog-only, or one-angle draft"
media_types = ["application/json"]

[[capabilities]]
id = "tick_all"
title = "Single scheduled mutator: score pending briefs; never auto-publish; does not survey GitHub"
accepts_impulse_types = ["hom.brief"]
emits_reaction_kinds = ["hom.decision"]
emits_association_kinds = ["hom.score"]

[[correlation_paths]]
id = "operator_tick"
title = "Brief → score → draft or kill"

[[correlation_paths.effectors]]
id = "tick"
capability = "tick_all"
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.tick_all"] }

[[impulse_types]]
id = "github.scan"
title = "Public GitHub repo to survey"
media_types = ["application/json"]
value_schema = { type = "object", properties = { project_id = { type = "string" }, repo = { type = "string" } }, required = ["project_id", "repo"] }

[[reaction_kinds]]
id = "github.survey"
title = "Public GitHub survey or scan silence"
media_types = ["application/json"]

[[reaction_kinds]]
id = "github.pack"
title = "Packed ship facts or scan silence"
media_types = ["application/json"]

[[reaction_kinds]]
id = "hom.brief"
title = "Pending HoM brief or scan silence"
media_types = ["application/json"]

[[capabilities]]
id = "github_survey"
title = "Public GitHub signals → JSON; silence if missing, unauth, private, or empty"
accepts_impulse_types = ["github.scan"]
emits_reaction_kinds = ["github.survey"]

[[capabilities]]
id = "github_pack"
title = "Pack ship+tryable facts or silence; waitlist and commit noise fail closed"
accepts_impulse_types = ["github.scan"]
emits_reaction_kinds = ["github.pack"]

[[capabilities]]
id = "brief_admit"
title = "Admit at most one pending brief into state.db; never opens runtime.db; does not call gh"
accepts_impulse_types = ["github.scan"]
emits_reaction_kinds = ["hom.brief"]

[[correlation_paths]]
id = "github_scan"
title = "Public GitHub survey → 0 or 1 pending brief"
description = "Fala conducts github_survey → github_pack → influenzer.brief_admit. Domain state stays in state.db. Effectors never open runtime.db. Not on the 5-minute tick."

[[correlation_paths.effectors]]
id = "survey"
capability = "github_survey"
adapter = { kind = "subprocess", command = ["python3", "-m", "github_survey"] }

[[correlation_paths.effectors]]
id = "pack"
capability = "github_pack"
conduction = ["survey"]
adapter = { kind = "subprocess", command = ["python3", "-m", "github_pack"] }

[[correlation_paths.effectors]]
id = "admit"
capability = "brief_admit"
conduction = ["pack"]
adapter = { kind = "subprocess", command = ["python3", "-m", "influenzer.brief_admit"] }

# Always-on interval loop is `influenzer-tick` on a Mac mini (not a laptop LaunchAgent).
# Fala conducts tick and the github_scan path. `influenzer brief scan` is host compose.

# Fala-owned journal. Domain state stays in state.db. Effectors never open this file.
[runtime.backend]
kind = "sqlite"
path = "runtime.db"

[runtime.reaction_store]
kind = "filesystem"
root = "artifacts/fala-reactions"
