[project]
name = "influenzer"
version = "0.1.0"
description = "Local 24/7 Head of Marketing operator: briefs in, scored drafts out"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "mikolaj92" }]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
influenzer = "influenzer.cli:main"
influenzer-tick-all = "influenzer.tick_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["influenzer"]

[tool.uv]
package = true
